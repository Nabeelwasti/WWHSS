permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_test?schema=public"
      INTEGRATION_TEST_DB_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: ci_wwhs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (ci)
        working-directory: backend
        run: npm ci
      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
      - name: Verify migration directory presence
        working-directory: backend
        run: test -d prisma/migrations && test -f prisma/migrations/migration_lock.toml
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Deploy Prisma migrations (unit test DB)
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create dedicated integration test database
        working-directory: backend
        run: |
          if PGPASSWORD=ci_password_12345 psql -h localhost -U ci_user -d ci_wwhs_test -tAc "SELECT 1 FROM pg_database WHERE datname = 'ci_wwhs_integration_test'" | grep -q 1; then
            echo "Database ci_wwhs_integration_test already exists."
          else
            PGPASSWORD=ci_password_12345 psql -h localhost -U ci_user -d ci_wwhs_test -c "CREATE DATABASE ci_wwhs_integration_test;"
          fi
      - name: Deploy Prisma migrations (integration test DB)
        working-directory: backend
        run: DATABASE_URL="$INTEGRATION_TEST_DB_URL" npx prisma migrate deploy
      - name: Dependency security check
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Run unit & security tests
        working-directory: backend
        run: npm run test:unit
      - name: Run integration & concurrency tests
        working-directory: backend
        run: npm run test:integration
      - name: Type-check and build
        working-directory: backend
        run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (ci)
        working-directory: frontend
        run: npm ci
      - name: Dependency security check
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile build (backend)
        run: docker build -t wwhs-backend:ci ./backend
      - name: Validate Dockerfile build (frontend)
        run: docker build -t wwhs-frontend:ci ./frontend
