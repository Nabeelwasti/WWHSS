permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_test?schema=public"
      INTEGRATION_TEST_DB_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
      SHADOW_DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_shadow?schema=public"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: ci_wwhs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_wwhs_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (ci)
        working-directory: backend
        run: npm ci
      - name: Verify package-lock consistency
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
      - name: Create Prisma shadow database
        run: |
          CONTAINER_ID=$(docker ps -q -f name=postgres)
          DB_EXISTS=$(docker exec "$CONTAINER_ID" psql -U ci_user -d ci_wwhs_test -tAc "SELECT 1 FROM pg_database WHERE datname='ci_wwhs_shadow';")
          if [ "$DB_EXISTS" != "1" ]; then docker exec "$CONTAINER_ID" psql -U ci_user -d ci_wwhs_test -c "CREATE DATABASE ci_wwhs_shadow;"; fi
      - name: Verify Prisma schema and migration history are equivalent
        working-directory: backend
        env:
          SHADOW_DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_shadow?schema=public"
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Verify migration directory presence
        working-directory: backend
        run: test -d prisma/migrations && test -f prisma/migrations/migration_lock.toml
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Deploy Prisma migrations (unit test DB)
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Create dedicated integration test database
        run: |
          CONTAINER_ID=$(docker ps -q -f name=postgres)
          DB_EXISTS=$(docker exec "$CONTAINER_ID" psql -U ci_user -d ci_wwhs_test -tAc "SELECT 1 FROM pg_database WHERE datname='ci_wwhs_integration_test';")
          if [ "$DB_EXISTS" != "1" ]; then docker exec "$CONTAINER_ID" psql -U ci_user -d ci_wwhs_test -c "CREATE DATABASE ci_wwhs_integration_test;"; fi
      - name: Deploy Prisma migrations (integration test DB)
        working-directory: backend
        run: DATABASE_URL="$INTEGRATION_TEST_DB_URL" npx prisma migrate deploy
      - name: Dependency security check
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Run unit & security tests
        working-directory: backend
        run: npm run test:unit
      - name: Run integration & concurrency tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
          INTEGRATION_TEST_DB_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
        run: npm run test:integration
      - name: Type-check and build
        working-directory: backend
        run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (ci)
        working-directory: frontend
        run: npm ci
      - name: Verify package-lock consistency
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - name: Dependency security check
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Dockerfile build (backend)
        run: docker build -t wwhs-backend:ci ./backend
      - name: Validate Dockerfile build (frontend)
        run: docker build -t wwhs-frontend:ci ./frontend
      - name: Smoke-test production backend container
        run: |
          docker run -d --rm --name wwhs-backend-smoke -p 18080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/ci' \
            -e JWT_ACCESS_SECRET='ci-access-secret-at-least-32-characters-long' \
            -e JWT_REFRESH_SECRET='ci-refresh-secret-at-least-32-characters-long' \
            -e JWT_ISSUER='ci-issuer' \
            -e JWT_AUDIENCE='ci-audience' \
            -e BACKUP_ENCRYPTION_KEY='ci-backup-secret-at-least-32-characters-long' \
            -e STORAGE_PROVIDER=s3 -e BACKUP_PROVIDER=s3 \
            -e S3_BUCKET=ci-bucket -e S3_REGION=us-east-1 \
            -e CORS_ORIGIN=https://ci.example.test -e TRUST_PROXY=1 \
            wwhs-backend:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then exit 0; fi
            sleep 1
          done
          docker logs wwhs-backend-smoke
          exit 1
      - name: Validate Vercel release configuration
        run: |
          test -f frontend/vercel.ts
          test -f frontend/vercel.legacy.json
          ! grep -R "wwhss-backend-nabeel-wasti.vercel.app" frontend/vercel.ts
          grep -q '"deploymentEnabled": false' vercel.json

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    env:
      DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_e2e?schema=public"
      E2E_BASE_URL: "http://127.0.0.1:5173"
      E2E_ADMIN_EMAIL: "admin@wwhs.local"
      E2E_ADMIN_PASSWORD: "ChangeMe!123"
      ADMIN_EMAIL: "admin@wwhs.local"
      ADMIN_PASSWORD: "ChangeMe!123"
      JWT_ACCESS_SECRET: "ci-access-secret-at-least-32-characters-long"
      JWT_REFRESH_SECRET: "ci-refresh-secret-at-least-32-characters-long"
      BACKUP_ENCRYPTION_KEY: "ci-backup-secret-at-least-32-characters-long"
      STORAGE_PROVIDER: local
      BACKUP_PROVIDER: local
      CORS_ORIGIN: "http://127.0.0.1:5173"
      TRUST_PROXY: "0"
      WEB_RESEARCH_ENABLED: "false"
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: ci_wwhs_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_wwhs_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client and deploy E2E database
        working-directory: backend
        run: npx prisma generate && npx prisma migrate deploy
      - name: Seed deterministic administrator
        working-directory: backend
        run: npm run seed
      - name: Install browser test dependencies
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0 @axe-core/playwright@4.13.0
      - name: Install Chromium for browser verification
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Start real backend
        working-directory: backend
        run: npm run dev -- --host 127.0.0.1 > /tmp/wwhs-backend.log 2>&1 & echo $! > /tmp/wwhs-backend.pid
      - name: Start real Vite frontend with /api proxy
        working-directory: frontend
        run: npm run dev -- --host 127.0.0.1 > /tmp/wwhs-frontend.log 2>&1 & echo $! > /tmp/wwhs-frontend.pid
      - name: Wait for complete application readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/tmp/health.json && curl --fail --silent http://127.0.0.1:5173/ >/tmp/home.html; then cat /tmp/health.json; exit 0; fi
            sleep 2
          done
          cat /tmp/wwhs-backend.log || true
          cat /tmp/wwhs-frontend.log || true
          exit 1
      - name: Run authenticated browser, accessibility, and public smoke tests
        working-directory: frontend
        run: ./node_modules/.bin/playwright test
      - name: Collect application logs on failure
        if: failure()
        run: cat /tmp/wwhs-backend.log || true; cat /tmp/wwhs-frontend.log || true
      - name: Stop application processes
        if: always()
        run: kill "$(cat /tmp/wwhs-backend.pid 2>/dev/null)" "$(cat /tmp/wwhs-frontend.pid 2>/dev/null)" 2>/dev/null || true
