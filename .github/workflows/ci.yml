permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_test?schema=public"
      INTEGRATION_TEST_DB_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
      S3_ENDPOINT: "http://localhost:9000"
      S3_REGION: "us-east-1"
      S3_BUCKET: "wwhss-backups"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_12345
          POSTGRES_DB: ci_wwhs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_wwhs_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 5
      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        command: server /data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (ci)
        working-directory: backend
        run: npm ci
      - name: Verify package-lock consistency
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
      - name: Verify migration directory presence
        working-directory: backend
        run: test -d prisma/migrations && test -f prisma/migrations/migration_lock.toml
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Deploy Prisma migrations (unit test DB)
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Create dedicated integration test database
        run: |
          CONTAINER_ID=$(docker ps -q -f name=postgres)
          DB_EXISTS=$(docker exec "$CONTAINER_ID" psql -U ci_user -d ci_wwhs_test -tAc "SELECT 1 FROM pg_database WHERE datname='ci_wwhs_integration_test';")
          if [ "$DB_EXISTS" != "1" ]; then
            docker exec "$CONTAINER_ID" psql -U ci_user -d ci_wwhs_test -c "CREATE DATABASE ci_wwhs_integration_test;"
          fi
      - name: Deploy Prisma migrations (integration test DB)
        working-directory: backend
        run: DATABASE_URL="$INTEGRATION_TEST_DB_URL" npx prisma migrate deploy
      - name: Dependency security check
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Run unit & security tests
        working-directory: backend
        run: npm run test:unit
      - name: Run integration & concurrency tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
          INTEGRATION_TEST_DB_URL: "postgresql://ci_user:ci_password_12345@localhost:5432/ci_wwhs_integration_test?schema=public"
        run: npm run test:integration
      - name: Type-check and build
        working-directory: backend
        run: npm run build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (ci)
        working-directory: frontend
        run: npm ci
      - name: Verify package-lock consistency
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code -- package-lock.json
      - name: Dependency security check
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile build (backend)
        run: docker build -t wwhs-backend:ci ./backend
      - name: Validate Dockerfile build (frontend)
        run: docker build -t wwhs-frontend:ci ./frontend

  browser-e2e:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium for browser verification
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start frontend preview
        working-directory: frontend
        run: nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/wwhss-frontend.log 2>&1 &
      - name: Run browser smoke tests
        working-directory: frontend
        run: npx --yes playwright@1.55.0 test
