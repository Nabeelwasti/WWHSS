name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify exact commit passed CI
    runs-on: ubuntu-latest
    steps:
      - name: Check latest CI workflow for exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          RUNS="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "${GITHUB_SHA}" --limit 100 --json databaseId,conclusion,createdAt,headSha)"
          LATEST="$(printf '%s' "$RUNS" | jq -c 'sort_by(.createdAt) | last // empty')"
          test -n "$LATEST"
          test "$(printf '%s' "$LATEST" | jq -r '.headSha')" = "$GITHUB_SHA"
          test "$(printf '%s' "$LATEST" | jq -r '.conclusion')" = "success"
          RUN_ID="$(printf '%s' "$LATEST" | jq -r '.databaseId')"
          test -n "$RUN_ID"
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion,headSha --jq --arg sha "$GITHUB_SHA" 'select(.conclusion=="success" and .headSha==$sha) | .conclusion' | grep -qx success

  deploy:
    needs: verify-release
    name: Build and deploy production backend
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/wwhss-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release configuration
        run: |
          test -n "$PROJECT_ID"
          test -n "$GAR_LOCATION"
          test -n "$GAR_REPOSITORY"
          test -n "$CLOUD_RUN_SERVICE"
          test -n "$CLOUD_RUN_REGION"
          test -n "${{ secrets.WIF_PROVIDER }}"
          test -n "${{ secrets.WIF_SERVICE_ACCOUNT }}"
          test -n "${{ secrets.PRODUCTION_DATABASE_URL }}"
          test -n "${{ secrets.PRODUCTION_SMOKE_EMAIL }}"
          test -n "${{ secrets.PRODUCTION_SMOKE_PASSWORD }}"
          test -n "${{ vars.PRODUCTION_FRONTEND_ORIGIN }}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        id: docker-login

      - name: Configure Docker credential helper
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build backend image
        run: docker build --pull -t "${IMAGE}" ./backend

      - name: Push backend image
        run: docker push "${IMAGE}"

      - name: Apply production migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm ci
          npx prisma migrate deploy

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --no-traffic
            --min-instances=0
            --max-instances=3
            --startup-probe=httpGet.path=/ready,httpGet.port=8080,initialDelaySeconds=2,timeoutSeconds=3,periodSeconds=10,failureThreshold=12

      - name: Resolve deployed revision URL
        id: revision
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$CLOUD_RUN_REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$REVISION"
          REVISION_URL="$(gcloud run revisions describe "$REVISION" --region "$CLOUD_RUN_REGION" --format='value(status.url)')"
          test -n "$REVISION_URL"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$REVISION_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed revision image
        run: |
          set -euo pipefail
          DEPLOYED_IMAGE="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$CLOUD_RUN_REGION" --format='value(spec.template.spec.containers[0].image)')"
          test "$DEPLOYED_IMAGE" = "$IMAGE"

      - name: Verify production readiness
        env:
          REVISION_URL: ${{ steps.revision.outputs.url }}
          SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
          FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          FRONTEND_ORIGIN="${FRONTEND_ORIGIN%/}"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$FRONTEND_ORIGIN/" -o /tmp/frontend.html
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$FRONTEND_ORIGIN/dashboard" -o /tmp/frontend-dashboard.html
          grep -qi '<html' /tmp/frontend.html
          grep -qi '<html' /tmp/frontend-dashboard.html
          ASSET_PATH="$(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/frontend.html | head -n1 | cut -d'"' -f2)"
          test -n "$ASSET_PATH"
          case "$ASSET_PATH" in
            https://*) ASSET_URL="$ASSET_PATH" ;;
            /*) ASSET_URL="$FRONTEND_ORIGIN$ASSET_PATH" ;;
            *) ASSET_URL="$FRONTEND_ORIGIN/$ASSET_PATH" ;;
          esac
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$ASSET_URL" -o /tmp/frontend.js
          test -s /tmp/frontend.js

          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$REVISION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$REVISION_URL/ready" | tee /tmp/ready.json
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$REVISION_URL/api/health" | tee /tmp/api-health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"status":"ok"' /tmp/api-health.json

          rm -f /tmp/cookies.txt
          curl --fail --silent --show-error --dump-header /tmp/login.headers --cookie-jar /tmp/cookies.txt -H "Origin: $FRONTEND_ORIGIN" -H "Content-Type: application/json" --data "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" "$REVISION_URL/api/auth/login" >/tmp/login.json
          grep -q '^HTTP/.* 200 ' /tmp/login.headers
          grep -Eqi '^set-cookie: refresh_token=.*HttpOnly' /tmp/login.headers
          grep -Eqi '^set-cookie: refresh_token=.*Secure' /tmp/login.headers
          grep -Eqi '^set-cookie: refresh_token=.*SameSite=None' /tmp/login.headers
          ACCESS_TOKEN="$(sed -n 's/.*"accessToken":"\\([^"]*\\)".*/\\1/p' /tmp/login.json)"
          test -n "$ACCESS_TOKEN"
          INITIAL_REFRESH_TOKEN="$(awk '$6=="refresh_token" {print $7}' /tmp/cookies.txt)"
          test -n "$INITIAL_REFRESH_TOKEN"

          UNAUTH_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Origin: $FRONTEND_ORIGIN" "$REVISION_URL/api/school/profile")"
          test "$UNAUTH_STATUS" = "401"

          curl --fail --silent --show-error --dump-header /tmp/me.headers -H "Origin: $FRONTEND_ORIGIN" -H "Authorization: Bearer $ACCESS_TOKEN" "$REVISION_URL/api/auth/me" >/tmp/me.json
          grep -Fqi "access-control-allow-origin: $FRONTEND_ORIGIN" /tmp/me.headers
          grep -q '"user"' /tmp/me.json

          curl --fail --silent --show-error -H "Origin: $FRONTEND_ORIGIN" -H "Authorization: Bearer $ACCESS_TOKEN" "$REVISION_URL/api/school/profile" >/tmp/school.json
          grep -q '"profile"' /tmp/school.json

          curl --fail --silent --show-error --dump-header /tmp/refresh.headers -H "Origin: $FRONTEND_ORIGIN" --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt -X POST "$REVISION_URL/api/auth/refresh" >/tmp/refresh.json
          grep -q '"accessToken"' /tmp/refresh.json
          grep -Eqi '^set-cookie: refresh_token=.*HttpOnly' /tmp/refresh.headers
          grep -Eqi '^set-cookie: refresh_token=.*Secure' /tmp/refresh.headers
          ROTATED_REFRESH_TOKEN="$(awk '$6=="refresh_token" {print $7}' /tmp/cookies.txt)"
          test -n "$ROTATED_REFRESH_TOKEN"
          test "$ROTATED_REFRESH_TOKEN" != "$INITIAL_REFRESH_TOKEN"

          cp /tmp/cookies.txt /tmp/cookies-after-refresh.txt
          curl --fail --silent --show-error -H "Origin: $FRONTEND_ORIGIN" --cookie /tmp/cookies.txt -X POST "$REVISION_URL/api/auth/logout" >/dev/null
          LOGOUT_REPLAY_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -H "Origin: $FRONTEND_ORIGIN" --cookie /tmp/cookies-after-refresh.txt -X POST "$REVISION_URL/api/auth/refresh")"
          test "$LOGOUT_REPLAY_STATUS" = "401"

      - name: Promote verified revision
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"             --region "$CLOUD_RUN_REGION"             --to-revisions "${{ steps.revision.outputs.revision }}=100"
