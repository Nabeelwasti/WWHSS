name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify exact commit passed CI
    runs-on: ubuntu-latest
    steps:
      - name: Check successful CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "${{ github.sha }}" --status completed --json databaseId,conclusion --jq '.[] | select(.conclusion=="success") | .databaseId' | head -n1)"
          test -n "$RUN_ID"
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --json conclusion --jq '.conclusion' | grep -qx success

  deploy:
    needs: verify-release
    name: Build and deploy production backend
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/wwhss-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release configuration
        run: |
          test -n "$PROJECT_ID"
          test -n "$GAR_LOCATION"
          test -n "$GAR_REPOSITORY"
          test -n "$CLOUD_RUN_SERVICE"
          test -n "$CLOUD_RUN_REGION"
          test -n "${{ secrets.WIF_PROVIDER }}"
          test -n "${{ secrets.WIF_SERVICE_ACCOUNT }}"
          test -n "${{ secrets.PRODUCTION_DATABASE_URL }}"
          test -n "${{ secrets.PRODUCTION_SMOKE_EMAIL }}"
          test -n "${{ secrets.PRODUCTION_SMOKE_PASSWORD }}"
          test -n "${{ vars.PRODUCTION_FRONTEND_ORIGIN }}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
        id: docker-login

      - name: Configure Docker credential helper
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build backend image
        run: docker build --pull -t "${IMAGE}" ./backend

      - name: Push backend image
        run: docker push "${IMAGE}"

      - name: Apply production migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          npm ci
          npx prisma migrate deploy

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --no-traffic
            --min-instances=0
            --max-instances=3

      - name: Resolve deployed revision URL
        id: revision
        run: |
          set -euo pipefail
          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$CLOUD_RUN_REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$REVISION"
          REVISION_URL="$(gcloud run revisions describe "$REVISION" --region "$CLOUD_RUN_REGION" --format='value(status.url)')"
          test -n "$REVISION_URL"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$REVISION_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed revision image
        run: |
          set -euo pipefail
          DEPLOYED_IMAGE="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --region "$CLOUD_RUN_REGION" --format='value(spec.template.spec.containers[0].image)')"
          test "$DEPLOYED_IMAGE" = "$IMAGE"

      - name: Verify production readiness
        env:
          REVISION_URL: ${{ steps.revision.outputs.url }}
          SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
          FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$REVISION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$REVISION_URL/ready" | tee /tmp/ready.json
          curl --fail --silent --show-error --retry 10 --retry-delay 5 "$REVISION_URL/api/health" | tee /tmp/api-health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"status":"ready"' /tmp/ready.json
          grep -q '"status":"ok"' /tmp/api-health.json

          rm -f /tmp/cookies.txt
          LOGIN_HEADERS="$(curl --fail --silent --show-error --include --cookie-jar /tmp/cookies.txt -H "Origin: $FRONTEND_ORIGIN" -H "Content-Type: application/json" --data "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" "$REVISION_URL/api/auth/login")"
          echo "$LOGIN_HEADERS" | grep -qi '^HTTP/.* 200 '
          ACCESS_TOKEN="$(printf '%s' "$LOGIN_HEADERS" | sed -n 's/^.*"accessToken":"\([^"]*\)".*$/\1/p' | head -n1)"
          test -n "$ACCESS_TOKEN"

          curl --fail --silent --show-error -H "Origin: $FRONTEND_ORIGIN" -H "Authorization: Bearer $ACCESS_TOKEN" "$REVISION_URL/api/auth/me" >/tmp/me.json
          grep -q '"user"' /tmp/me.json

          curl --fail --silent --show-error -H "Origin: $FRONTEND_ORIGIN" --cookie /tmp/cookies.txt --cookie-jar /tmp/cookies.txt -X POST "$REVISION_URL/api/auth/refresh" >/tmp/refresh.json
          grep -q '"accessToken"' /tmp/refresh.json

          curl --fail --silent --show-error -H "Origin: $FRONTEND_ORIGIN" --cookie /tmp/cookies.txt -X POST "$REVISION_URL/api/auth/logout" >/dev/null

      - name: Promote verified revision
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"             --region "$CLOUD_RUN_REGION"             --to-revisions "${{ steps.revision.outputs.revision }}=100"
