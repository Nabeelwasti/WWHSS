server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Everything under /api goes to the backend container. Serving the site
  # and the API from ONE address means the browser never needs cross-site
  # (CORS) permissions, and login cookies work reliably.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://backend:4000/health;
  }

  # The service worker must always be re-checked so app updates reach phones.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: any other path serves index.html.
  location / {
    try_files $uri /index.html;
  }
}
